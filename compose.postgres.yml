# Independent DONARIUM database. No SKUFnya network or credentials.
services:
  app:
    depends_on:
      db:
        condition: service_healthy
  maintenance:
    profiles: [tools]
    build:
      context: .
      target: maintenance
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DB_MIGRATION_CONFIRM: ${DB_MIGRATION_CONFIRM:-}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: donarium
      POSTGRES_USER: donarium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a new POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5548:5432"
    volumes:
      - donarium_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U donarium -d donarium"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]
volumes:
  donarium_postgres:
