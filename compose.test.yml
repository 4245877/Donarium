# Dedicated disposable fixtures only. No production volume or network is mounted.
name: donarium-audit-test
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: donarium_test_source
      POSTGRES_USER: donarium_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5549:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=512m,mode=0700
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U donarium_test -d donarium_test_source"]
      interval: 1s
      timeout: 3s
      retries: 30
    security_opt: [no-new-privileges:true]
