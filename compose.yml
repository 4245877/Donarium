name: donarium
services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-4180}:4180"
    environment:
      HOST: 0.0.0.0
      PORT: 4180
      NODE_ENV: production
      DATA_MODE: ${DATA_MODE:-demo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-}
      EXTERNAL_STORAGE_BASE_URL: ${EXTERNAL_STORAGE_BASE_URL:-}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
